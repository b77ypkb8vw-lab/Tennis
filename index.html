<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis-Spielplan 2026–2027</title>
  <style>
    :root { --green:#1d6b43; --green2:#2f8c5d; --cream:#f5f7f3; --card:#fff; --text:#17211b; --muted:#68746c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--cream); color:var(--text); }
    header { background:linear-gradient(135deg,var(--green),var(--green2)); color:white; padding:32px 18px; }
    header div, main { max-width:850px; margin:auto; }
    h1 { margin:0 0 6px; font-size:clamp(1.8rem,5vw,2.7rem); }
    header p { margin:0; opacity:.9; }
    main { padding:22px 14px 40px; }
    .status { color:var(--muted); padding:12px 2px; }
    .match { display:grid; grid-template-columns:145px 1fr; gap:18px; align-items:center; background:var(--card); border-radius:14px; padding:17px 19px; margin:12px 0; box-shadow:0 3px 14px rgba(30,60,40,.09); border-left:6px solid var(--green2); }
    .date { font-weight:750; color:var(--green); }
    .players { display:grid; grid-template-columns:repeat(4,minmax(52px,1fr)); gap:8px; }
    .player { background:#edf6f0; border-radius:9px; padding:9px 7px; text-align:center; font-weight:650; }
    .empty { color:#9aa49e; font-weight:400; }
    @media (max-width:620px) {
      .match { grid-template-columns:1fr; gap:11px; }
      .players { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>
<header><div><h1>🎾 Tennis-Spielplan</h1><p>Anstehende Spieltermine</p></div></header>
<main>
  <div id="status" class="status">Spielplan wird geladen …</div>
  <section id="schedule"></section>
</main>
<script>
const CSV_FILE = "schedule.csv";

function parseDate(value) {
  const parts = value.trim().split(".");
  if (parts.length !== 3) return null;
  const year = Number(parts[2]) < 100 ? 2000 + Number(parts[2]) : Number(parts[2]);
  const d = new Date(year, Number(parts[1]) - 1, Number(parts[0]));
  d.setHours(0,0,0,0);
  return d;
}

fetch(CSV_FILE + "?v=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("CSV nicht gefunden"); return r.text(); })
  .then(text => {
    const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(x => x.trim());
    const rows = lines.slice(1).map(line => line.split(";").map(x => x.trim()));
    const today = new Date(); today.setHours(0,0,0,0);
    const games = rows
      .map(r => ({ date:parseDate(r[0]), rawDate:r[0], players:r.slice(1,5) }))
      .filter(g => g.date && g.date >= today && g.players.some(Boolean))
      .sort((a,b) => a.date-b.date);

    const host = document.getElementById("schedule");
    document.getElementById("status").textContent = games.length
      ? `${games.length} zukünftige Termine`
      : "Keine zukünftigen Spiele eingetragen.";

    games.forEach(g => {
      const card = document.createElement("article"); card.className="match";
      const date = document.createElement("div"); date.className="date";
      date.textContent = g.date.toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});
      const players = document.createElement("div"); players.className="players";
      g.players.forEach((p,i) => {
        const el=document.createElement("div"); el.className="player" + (p ? "" : " empty");
        el.textContent=p || `Spieler ${i+1} offen`; players.appendChild(el);
      });
      card.append(date,players); host.appendChild(card);
    });
  })
  .catch(err => {
    document.getElementById("status").textContent = "Der Spielplan konnte nicht geladen werden. Prüfe, ob schedule.csv im selben GitHub-Ordner wie index.html liegt.";
    console.error(err);
  });
</script>
</body>
</html>
