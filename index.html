<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis-Spielplan</title>

<style>
:root {
    --green:#2f7d4b;
    --light:#eef2ef;
    --card:#f8f9f8;
}

body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#efefef;
}

header{
    background:var(--green);
    color:white;
    padding:35px 25px;
}

h1{
    margin:0;
    font-size:3rem;
}

header p{
    margin-top:10px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.status{
    font-size:1.2rem;
    color:#666;
    margin-bottom:20px;
}

.match{
    background:#f5f5f5;
    margin-bottom:18px;
    border-radius:20px;
    padding:25px;
    display:grid;
    grid-template-columns:250px 1fr;
    gap:25px;
    border-left:8px solid var(--green);
}

.date{
    font-weight:700;
    font-size:1.1rem;
    color:#2d6544;
}

.players{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.player{
    background:#dfe6e1;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:700;
}

.empty{
    color:#999;
    font-weight:400;
}

@media(max-width:700px){

    .match{
        grid-template-columns:1fr;
    }

    .players{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:2rem;
    }
}
</style>

</head>

<body>

<header>
<h1>🎾 Tennis-Spielplan</h1>
<p>Anstehende Spieltermine</p>
</header>

<main>

<div id="status" class="status">
Spielplan wird geladen...
</div>

<div id="schedule"></div>

</main>

<script>

function parseDate(value){

    value = value.trim();

    // ISO Format
    // 2026-09-16

    if(value.includes("-")){

        const d = new Date(value);

        if(!isNaN(d)){
            d.setHours(0,0,0,0);
            return d;
        }
    }

    // Deutsches Format
    // 16.09.26

    if(value.includes(".")){

        const p = value.split(".");

        if(p.length === 3){

            let year = parseInt(p[2],10);

            if(year < 100){
                year += 2000;
            }

            const d = new Date(
                year,
                parseInt(p[1],10)-1,
                parseInt(p[0],10)
            );

            d.setHours(0,0,0,0);

            return d;
        }
    }

    return null;
}

fetch("schedule.csv?v=" + Date.now())

.then(r => r.text())

.then(text => {

    const lines = text
        .replace(/^\uFEFF/,'')
        .split(/\r?\n/)
        .filter(x => x.trim());

    const rows = lines.slice(1);

    const today = new Date();
    today.setHours(0,0,0,0);

    const games = [];

    rows.forEach(line => {

        const c = line.split(";");

        if(c.length < 5) return;

        const d = parseDate(c[0]);

        if(!d) return;

        if(d < today) return;

        games.push({
            date:d,
            players:[
                c[1],
                c[2],
                c[3],
                c[4]
            ]
        });

    });

    games.sort((a,b)=>a.date-b.date);

    const schedule =
        document.getElementById("schedule");

    document.getElementById("status")
        .innerHTML =
        games.length +
        " zukünftige Termine";

    games.forEach(g => {

        const card =
            document.createElement("div");

        card.className="match";

        const date =
            document.createElement("div");

        date.className="date";

        date.textContent =
            g.date.toLocaleDateString(
                "de-DE",
                {
                    weekday:"long",
                    day:"2-digit",
                    month:"long",
                    year:"numeric"
                }
            );

        const players =
            document.createElement("div");

        players.className="players";

        g.players.forEach((p,i)=>{

            const box =
                document.createElement("div");

            box.className="player";

            if(
                p === "" ||
                p === "0"
            ){
                box.classList.add("empty");
                box.textContent =
                    "Spieler " +
                    (i+1) +
                    " offen";
            }
            else{
                box.textContent = p;
            }

            players.appendChild(box);
        });

        card.appendChild(date);
        card.appendChild(players);

        schedule.appendChild(card);

    });

    if(games.length===0){

        document.getElementById("status")
            .innerHTML =
            "Keine zukünftigen Spiele eingetragen.";

    }

});

</script>

</body>
</html>
